modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config = "isleweaver_astrological.mixins.json"
[[mixins]]
config = "isleweaver_enderscape.mixins.json"
[[mixins]]
config = "isleweaver_stellarity.mixins.json"
[[mixins]]
config = "isleweaver_quark.mixins.json"
[[mixins]]
config = "isleweaver_phantasm.mixins.json"
[[mixins]]
