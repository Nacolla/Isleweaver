[[mixins]]
config = "isleweaver_unusualend.mixins.json"
[[mixins]]
config = "isleweaver_blueprint.mixins.json"
[[mixins]]
config = "isleweaver_core.mixins.json"
[[mixins]]
config = "isleweaver_mes.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="the_beyond"
type="required"
versionRange="[${the_beyond_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
